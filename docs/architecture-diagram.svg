<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">SIH CMPDI/CIL AI Reporting Platform Architecture</title>
  <desc id="desc">Implemented Docker Compose demo architecture for React frontend, FastAPI API, Celery worker, PostgreSQL pgvector, Redis, MinIO, document ingestion, Q&amp;A, reports, analytics, governance, and production extension options.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#1d4ed8" />
    </marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5.5 L0,11 Z" fill="#0f766e" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .boundary { fill: #ffffff; stroke: #64748b; stroke-width: 2.4; stroke-dasharray: 10 8; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .box-blue { fill: #eff6ff; stroke: #2563eb; }
      .box-teal { fill: #ecfdf5; stroke: #0f766e; }
      .box-amber { fill: #fffbeb; stroke: #ca8a04; }
      .box-slate { fill: #f1f5f9; stroke: #475569; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 500; fill: #475569; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .text { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 15px; fill: #334155; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; fill: #475569; }
      .tiny { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .flow { fill: none; stroke: #334155; stroke-width: 2.4; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #1d4ed8; stroke-width: 2.8; marker-end: url(#arrow-blue); }
      .flow-teal { fill: none; stroke: #0f766e; stroke-width: 2.8; marker-end: url(#arrow-teal); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .pill { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 1.4; rx: 6; }
      .pillText { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #334155; }
      .num { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #ffffff; }
      .circle { fill: #0f172a; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1920" height="1080" />
  <text class="title" x="60" y="48">SIH CMPDI/CIL AI Reporting Platform</text>
  <text class="subtitle" x="60" y="78">Implemented demo architecture: ingestion, retrieval, citation-backed Q&amp;A, governed reports, analytics, and auditability</text>

  <rect class="boundary" x="250" y="112" width="1255" height="900" />
  <text class="label" x="280" y="145">Docker Compose Demo Environment</text>

  <rect class="box box-slate" x="60" y="170" width="160" height="92" />
  <text class="label" x="90" y="205">CMPDI/CIL</text>
  <text class="label" x="104" y="232">Users</text>
  <text class="small" x="82" y="252">admin / analyst / viewer</text>

  <rect class="box box-blue" x="295" y="175" width="260" height="185" />
  <text class="label" x="320" y="207">React + Tailwind</text>
  <text class="text" x="320" y="237">Dashboard</text>
  <text class="text" x="320" y="262">Documents</text>
  <text class="text" x="320" y="287">Intelligence / Q&amp;A</text>
  <text class="text" x="320" y="312">Reports</text>
  <text class="text" x="320" y="337">Analytics</text>

  <rect class="box box-teal" x="625" y="155" width="310" height="250" />
  <text class="label" x="650" y="188">FastAPI REST API</text>
  <text class="text" x="650" y="220">JWT authentication</text>
  <text class="text" x="650" y="245">RBAC: admin / analyst / viewer</text>
  <text class="text" x="650" y="270">Upload, jobs, docs, search, Q&amp;A</text>
  <text class="text" x="650" y="295">Report governance lifecycle</text>
  <text class="small" x="668" y="322">Draft → In Review → Approved</text>
  <text class="small" x="668" y="344">Revision history + audit logs</text>
  <text class="small" x="650" y="375">Public health checks stay open</text>

  <rect class="box box-amber" x="1065" y="150" width="385" height="255" />
  <text class="label" x="1090" y="183">PostgreSQL + pgvector</text>
  <text class="text" x="1090" y="214">Tables</text>
  <text class="small" x="1110" y="239">users, documents, jobs, chunks</text>
  <text class="small" x="1110" y="261">reports, qa_answers, audit_logs</text>
  <text class="text" x="1090" y="296">Metadata and job tracking</text>
  <text class="text" x="1090" y="321">Chunks with vector embeddings</text>
  <text class="text" x="1090" y="346">Report versions and approvals</text>
  <text class="text" x="1090" y="371">Audit trail for user actions</text>

  <rect class="box" x="295" y="470" width="245" height="125" />
  <text class="label" x="320" y="503">MinIO Storage</text>
  <text class="text" x="320" y="535">S3-compatible objects</text>
  <text class="small" x="320" y="562">Uploaded PDFs, images,</text>
  <text class="small" x="320" y="582">DOCX, XLSX, CSV, TXT</text>

  <rect class="box" x="625" y="485" width="210" height="95" />
  <text class="label" x="665" y="520">Redis</text>
  <text class="text" x="660" y="550">Celery broker</text>

  <rect class="box box-blue" x="895" y="455" width="235" height="155" />
  <text class="label" x="925" y="488">Celery Worker</text>
  <text class="text" x="920" y="520">Async ingestion task</text>
  <text class="text" x="920" y="545">Status updates</text>
  <text class="text" x="920" y="570">Embedding backfill</text>

  <rect class="box box-slate" x="1190" y="440" width="260" height="185" />
  <text class="label" x="1215" y="472">Extraction/OCR</text>
  <text class="text" x="1215" y="505">PyMuPDF digital PDF</text>
  <text class="text" x="1215" y="530">Tesseract scanned PDFs/images</text>
  <text class="text" x="1215" y="555">DOCX / XLSX / CSV / TXT</text>
  <text class="text" x="1215" y="580">Chunking</text>
  <text class="text" x="1215" y="605">sentence-transformers embeddings</text>

  <rect class="box box-teal" x="295" y="715" width="315" height="200" />
  <text class="label" x="320" y="748">Intelligence Layer</text>
  <text class="text" x="320" y="780">Semantic search</text>
  <text class="text" x="320" y="805">Citation-backed Q&amp;A</text>
  <text class="text" x="320" y="830">Default local extractive mode</text>
  <text class="text" x="320" y="855">Optional Groq LLM mode</text>
  <text class="small" x="340" y="880">openai/gpt-oss-20b</text>
  <text class="small" x="340" y="902">Fallback on failure/rate limit</text>

  <rect class="box box-blue" x="665" y="715" width="300" height="200" />
  <text class="label" x="690" y="748">Reports</text>
  <text class="text" x="690" y="780">Automated report generation</text>
  <text class="text" x="690" y="805">Source document provenance</text>
  <text class="text" x="690" y="830">Approval workflow</text>
  <text class="text" x="690" y="855">Version history</text>
  <text class="text" x="690" y="880">Governance audit events</text>

  <rect class="box box-amber" x="1020" y="715" width="340" height="200" />
  <text class="label" x="1045" y="748">Analytics</text>
  <text class="text" x="1045" y="780">Topic modeling</text>
  <text class="text" x="1045" y="805">Word cloud</text>
  <text class="text" x="1045" y="830">Data Quality: 18-field benchmark</text>
  <text class="text" x="1045" y="855">Validation rules</text>
  <text class="text" x="1045" y="880">Workflow Metrics benchmark</text>
  <text class="text" x="1045" y="905">Automation coverage</text>

  <rect class="box" x="280" y="950" width="1160" height="38" />
  <text class="pillText" x="300" y="974">Compose services:</text>
  <rect class="pill" x="430" y="958" width="105" height="22" />
  <text class="pillText" x="455" y="974">frontend</text>
  <rect class="pill" x="550" y="958" width="75" height="22" />
  <text class="pillText" x="574" y="974">api</text>
  <rect class="pill" x="640" y="958" width="90" height="22" />
  <text class="pillText" x="661" y="974">worker</text>
  <rect class="pill" x="745" y="958" width="170" height="22" />
  <text class="pillText" x="770" y="974">postgres + pgvector</text>
  <rect class="pill" x="930" y="958" width="85" height="22" />
  <text class="pillText" x="952" y="974">redis</text>
  <rect class="pill" x="1030" y="958" width="85" height="22" />
  <text class="pillText" x="1052" y="974">minio</text>
  <text class="tiny" x="1140" y="974">Implemented in the local demo environment</text>

  <rect class="boundary" x="1550" y="765" width="310" height="190" />
  <text class="label" x="1580" y="805">Production Extension</text>
  <text class="text" x="1580" y="838">AWS EC2 / RDS / S3</text>
  <text class="text" x="1580" y="866">Self-hosted LLM option</text>
  <text class="small" x="1580" y="900">Not implemented in demo</text>

  <circle class="circle" cx="270" cy="102" r="12" />
  <text class="num" x="266" y="107">1</text>
  <text class="small" x="290" y="108">Upload ingestion flow</text>
  <circle class="circle" cx="500" cy="102" r="12" />
  <text class="num" x="496" y="107">2</text>
  <text class="small" x="520" y="108">Search/Q&amp;A retrieval flow</text>
  <circle class="circle" cx="760" cy="102" r="12" />
  <text class="num" x="756" y="107">3</text>
  <text class="small" x="780" y="108">Report governance flow</text>
  <circle class="circle" cx="1020" cy="102" r="12" />
  <text class="num" x="1016" y="107">4</text>
  <text class="small" x="1040" y="108">Analytics/evaluation flow</text>

